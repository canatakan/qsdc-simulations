[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "simulator"
version = "0.1.0"
description = "CV QSDC Gaussian-states protocol simulation with analytic and Strawberry Fields backends."
readme = "README.md"
requires-python = ">=3.9,<3.10"
dependencies = [
  "strawberryfields",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[project.scripts]
qsdc-demo = "simulator.cli.message_demo:main"

[tool.hatch.build.targets.wheel]
packages = ["simulator"]

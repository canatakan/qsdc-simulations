[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "qsdc-simulations"
version = "0.1.0"
description = "Continuous-variable QSDC protocol simulators."
readme = "README.md"
requires-python = ">=3.9,<3.10"
dependencies = [
  "Jinja2>=3.1,<4",
  "matplotlib",
  "numpy",
  "pydantic>=2.13,<3",
  "PyYAML>=6,<7",
  "strawberryfields",
]

[project.scripts]
cao-demo = "qsdc.protocols.cao.demo:main"
srikara-benchmark = "qsdc.protocols.srikara.benchmark.cli:main"
srikara-demo = "qsdc.protocols.srikara.demo:main"

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.hatch.build.targets.wheel]
packages = [
  "src/qsdc",
]

[tool.pytest.ini_options]
testpaths = [
  "tests",
]
addopts = [
  "--import-mode=importlib",
]

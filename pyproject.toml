[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "qsdc-simulations"
version = "0.1.0"
description = "Continuous-variable QSDC protocol simulators."
readme = "README.md"
requires-python = ">=3.9,<3.10"
dependencies = [
  "matplotlib",
  "numpy",
  "strawberryfields",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[project.scripts]
srikara-demo = "srikara.demo.message_demo:main"
srikara-basic-demo = "srikara.demo.basic_demo:main"
srikara-benchmark = "srikara.benchmark.cli:main"
srikara-benchmark-plot = "srikara.benchmark.plot:main"

[tool.hatch.build.targets.wheel]
packages = [
  "srikara",
  "utils",
]

[tool.pytest.ini_options]
testpaths = [
  "srikara/tests",
]
addopts = [
  "--import-mode=importlib",
]
